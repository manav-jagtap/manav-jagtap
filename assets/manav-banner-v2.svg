<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="230" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="230" rx="22" fill="url(#bg)"/>
    <rect width="1200" height="230" fill="url(#grid)"/>

    <circle cx="120" cy="70" r="70" fill="#0ea5e9" opacity="0.07">
      <animate attributeName="cx" values="100;210;100" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="175" r="90" fill="#2563eb" opacity="0.07">
      <animate attributeName="cx" values="1100;990;1100" dur="9s" repeatCount="indefinite"/>
    </circle>

    <rect x="175" y="38" width="850" height="154" rx="18" fill="#020617" opacity="0.34" stroke="#38bdf8" stroke-opacity="0.32"/>

    <text x="600" y="93" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="3">MANAV JAGTAP</text>
    <text x="600" y="132" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="1.6">PYTHON • DJANGO • AZURE</text>
    <text x="600" y="164" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">B.Sc. Computer Science • Practical projects • Hands-on learning</text>

    <rect x="250" y="185" width="700" height="2" rx="1" fill="#1e293b"/>
    <rect x="250" y="185" width="145" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="x" values="250;805;250" dur="5s" repeatCount="indefinite"/>
    </rect>

    <circle cx="92" cy="175" r="3.5" fill="#38bdf8">
      <animate attributeName="cy" values="175;145;175" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1112" cy="55" r="3.5" fill="#22d3ee">
      <animate attributeName="cy" values="55;85;55" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>