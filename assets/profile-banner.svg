<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#07111F"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accent" x1="240" y1="40" x2="960" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-100 0;100 0;-100 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7DD3FC" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="260" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>

    <circle cx="160" cy="70" r="90" fill="#0EA5E9" fill-opacity="0.08">
      <animate attributeName="cx" values="120;220;120" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="195" r="110" fill="#2563EB" fill-opacity="0.08">
      <animate attributeName="cx" values="1080;980;1080" dur="9s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.9">
      <circle cx="180" cy="190" r="4" fill="#38BDF8">
        <animate attributeName="cy" values="190;155;190" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1005" cy="74" r="3" fill="#22D3EE">
        <animate attributeName="cy" values="74;108;74" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1110" cy="145" r="4" fill="#60A5FA">
        <animate attributeName="cx" values="1110;1060;1110" dur="5.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="180" y="46" width="840" height="168" rx="20" fill="#020617" fill-opacity="0.34" stroke="url(#accent)" stroke-opacity="0.7"/>

    <text x="600" y="105" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="3">MANAV JAGTAP</text>
    <text x="600" y="145" text-anchor="middle" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.2">PYTHON • DJANGO • AZURE</text>
    <text x="600" y="181" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">B.Sc. Computer Science • Building practical software through hands-on learning</text>

    <rect x="240" y="208" width="720" height="2" rx="1" fill="url(#accent)" filter="url(#glow)">
      <animate attributeName="x" values="240;320;240" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="width" values="720;560;720" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>